<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Nepalese and Indian groceries in Leppington: fresh produce, halal meat, fridge and freezer goods. Same-day delivery before 5pm and Click & Collect in 5 minutes.">
<meta name="theme-color" content="#0f766e">
<meta property="og:title" content="Leppington Nepalese and Indian Grocery">
<meta property="og:description" content="Same-day delivery before 5pm and Click &amp; Collect in 5 minutes.">
<meta property="og:url" content="https://leppington.shop/">
<link rel="icon" href="logo-mark.svg" type="image/svg+xml">
<title>Leppington Nepalese and Indian Grocery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: maroon store header, white category bar with fulfilment selector, supermarket catalogue (sidebar filters + dense product grid), cart drawer, full checkout page. Single light retail theme by choice. */
:root{
  color-scheme:light;
  --brand:#0f766e; --brand-dk:#0b5753; --brand-ink:#ffffff;
  --act:#0f766e;
  --special:#ff6b57; --special-ink:#1d1d1f;
  --ink:#1d1d1f; --ink-2:#4a4a4f; --muted:#6e6e73;
  --page:#f3f6f5; --card:#ffffff; --line:#dfe6e4; --line-2:#c8d3d0; --tint:#f5f9f8;
  --ok:#0f7a3d; --ok-soft:#e6f4ec; --cold:#1f5fbf; --cold-soft:#e8f0fb; --warn-soft:#fff6d6;
  --f-head:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:8px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--page);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:3px solid #ff6b57;outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;text-wrap:balance;letter-spacing:.005em}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.util{background:var(--brand-dk);color:#d3ecea;font-size:12.5px}
.util .wrap{display:flex;justify-content:space-between;gap:16px;padding-block:6px}
.util nav{display:flex;gap:18px}
.util button{color:inherit;font-size:12.5px}
.util button:hover{color:#fff;text-decoration:underline}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40}
.hdr-main{background:var(--brand);color:var(--brand-ink)}
.hdr-main .wrap{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:24px;align-items:center;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;line-height:1}
.logo .mark{flex:none}
.logo .lw{display:flex;flex-direction:column}
.logo .w{font-family:var(--f-head);font-weight:800;font-size:28px;letter-spacing:.02em}
.logo .w i{font-style:normal;color:#ff8a73}
.logo .t{font-size:10.5px;letter-spacing:.14em;color:#ffc2b6 !important;text-transform:uppercase;margin-top:4px;color:#d3ecea;font-weight:600}
.srch{display:flex;background:#fff;border-radius:var(--r);overflow:hidden;max-width:720px;width:100%;justify-self:center}
.srch input{flex:1;min-width:0;border:0;padding:0 14px;height:46px;color:var(--ink);outline:none;font-size:15px}
.srch button{width:52px;display:grid;place-items:center;color:var(--brand);border-left:1px solid var(--line)}
.hdr-act{display:flex;gap:6px;align-items:center}
.hbtn{display:flex;align-items:center;gap:8px;color:#fff;padding:8px 10px;border-radius:var(--r);font-weight:600;font-size:14px}
.hbtn:hover{background:rgba(255,255,255,.1)}
.cartb{background:#fff;color:var(--brand);padding:9px 14px}
.cartb:hover{background:#fff}
.cartb .ct{background:var(--brand);color:#fff;border-radius:10px;min-width:20px;height:20px;font-size:12px;display:grid;place-items:center;padding:0 5px}
.cartb .amt{font-family:var(--f-head);font-size:18px;font-weight:700}

.catbar{background:var(--card);border-bottom:1px solid var(--line)}
.catbar .wrap{display:flex;align-items:stretch;gap:4px;min-height:50px}
.browse{display:flex;align-items:center;gap:8px;font-weight:700;padding:0 14px 0 0;border-right:1px solid var(--line);margin-right:6px;white-space:nowrap}
.browse svg{transition:transform .2s}
.browse[aria-expanded="true"] svg{transform:rotate(180deg)}
.links{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.links::-webkit-scrollbar{display:none}
.links a{display:flex;align-items:center;padding:0 12px;text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent}
.links a:hover{color:var(--brand)}
.links a[aria-current="page"]{border-color:var(--brand);color:var(--brand)}
.links a.sp{color:#c2412d}
.ful{display:flex;align-items:center;gap:10px;margin-left:auto;padding:6px 0 6px 14px;border-left:1px solid var(--line);text-align:left;white-space:nowrap}
.ful .ic{width:34px;height:34px;border-radius:50%;background:var(--tint);display:grid;place-items:center;color:var(--brand);flex:none}
.ful b{display:block;font-size:13.5px}
.ful span{font-size:12.5px;color:var(--muted)}
.ful .chg{color:var(--brand);font-weight:700;font-size:13px;text-decoration:underline}
.mega{position:absolute;left:0;right:0;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 18px 30px -18px rgba(0,0,0,.25)}
.mega .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:24px;padding-block:22px 26px}
.mega h4{font-size:17px;margin-bottom:8px}
.mega h4 button{font-weight:700}
.mega h4 button:hover{color:var(--brand)}
.mega ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.mega li button{color:var(--ink-2);font-size:14px;text-align:left}
.mega li button:hover{color:var(--brand);text-decoration:underline}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r);padding:11px 18px;font-weight:700;font-size:15px}
.btn-p{background:var(--act);color:#fff}
.btn-p:hover{background:var(--brand-dk)}
.btn-o{border:1.5px solid var(--ink);color:var(--ink);background:var(--card)}
.btn-o:hover{background:var(--tint)}
.btn-w{background:#fff;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lnk{color:var(--brand);font-weight:700;text-decoration:underline;font-size:14px}

.hero{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;padding-block:18px}
.car{position:relative;border-radius:var(--r);overflow:hidden;min-height:330px;background:var(--brand)}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:center;padding:34px 40px;opacity:0;transition:opacity .5s;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide h2{font-size:clamp(30px,3.6vw,48px);line-height:1;font-weight:800;margin:0 0 12px}
.slide p{margin:0 0 20px;font-size:16px;max-width:36ch}
.slide .art{display:flex;align-items:flex-end;justify-content:center;height:100%;min-width:0}
.slide .art svg{width:46%;max-width:200px;height:auto;flex:none;margin:0 -4%}
.slide .art svg:nth-child(2){width:56%;max-width:240px;position:relative;z-index:1}
.price-burst{display:inline-flex;align-items:baseline;gap:8px;background:#1d1d1f;color:#fff;padding:6px 12px;border-radius:6px;font-family:var(--f-head);font-weight:800;margin-bottom:18px}
.price-burst .big{font-size:34px;line-height:1}
.dots{position:absolute;left:40px;bottom:18px;display:flex;gap:8px;z-index:2}
.dots button{width:28px;height:5px;border-radius:3px;background:rgba(127,127,127,.45)}
.dots button[aria-current="true"]{background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.side{display:grid;gap:16px}
.promo{border-radius:var(--r);padding:22px;display:flex;justify-content:space-between;gap:14px;align-items:center;min-width:0}
.promo h3{font-size:24px;line-height:1.05;margin-bottom:6px}
.promo p{margin:0 0 12px;font-size:14px}
.promo svg{flex:none}
.tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;padding-block:6px 10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-weight:700;font-size:14px;text-decoration:none}
.tile .circ{width:100%;max-width:120px;aspect-ratio:1;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;transition:border-color .15s}
.tile:hover .circ{border-color:var(--brand)}
.tile .circ svg{width:78%;height:auto}
.shelf{padding-block:22px 6px}
.shelf-h{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px;gap:12px}
.shelf-h h2{font-size:28px;font-weight:800}
.shelf-h .ctrls{display:flex;gap:6px;align-items:center}
.arr{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);background:var(--card);display:grid;place-items:center}
.arr:hover{border-color:var(--ink)}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:200px;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:thin}
.row > *{scroll-snap-align:start}
.ways{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding-block:28px}
.way{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:8px;align-content:start}
.way h3{font-size:22px}
.way p{margin:0;color:var(--ink-2);font-size:14.5px}
.way .k{font-family:var(--f-head);font-weight:800;font-size:40px;line-height:1;color:var(--brand)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0;position:relative;transition:box-shadow .15s}
.card:hover{box-shadow:0 6px 20px -10px rgba(0,0,0,.25)}
.cimg{display:block;width:100%;aspect-ratio:1/0.9;max-width:100%;padding:10px 14px 0;position:relative}
.cimg svg,.cimg img{width:100%;height:100%;object-fit:contain;display:block}
.tagS{position:absolute;top:10px;left:10px;background:var(--special);color:var(--special-ink);font-weight:800;font-family:var(--f-head);font-size:14px;padding:3px 8px;border-radius:4px;z-index:1;letter-spacing:.02em}
.tagH{position:absolute;bottom:4px;left:10px;font-size:11px;font-weight:700;color:var(--ok);background:var(--ok-soft);padding:2px 6px;border-radius:4px}
.tagN{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;color:var(--brand);background:#ffebe7;padding:2px 6px;border-radius:4px;z-index:1}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
.pr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pr .now{font-family:var(--f-head);font-weight:800;font-size:28px;line-height:1;letter-spacing:-.01em}
.pr .now sup{font-size:15px;vertical-align:9px;margin-left:1px}
.pr .now.sale{color:#d9452f}
.cup{font-size:12px;color:var(--muted);min-height:17px}
.was{font-size:12.5px;color:var(--ink-2)}
.cname{text-align:left;font-size:14px;line-height:1.3;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:3.9em}
.cname:hover{text-decoration:underline}
.cacts{margin-top:auto;display:grid;gap:6px;padding-top:4px}
.wsel{height:34px;border:1px solid var(--line-2);border-radius:6px;background:var(--card);padding:0 8px;font-size:13.5px;width:100%}
.addb{height:40px;border-radius:var(--r);background:var(--act);color:#fff;font-weight:700;width:100%}
.addb:hover{background:var(--brand-dk)}
.addb:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.stp{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;height:40px;border:1.5px solid var(--act);border-radius:var(--r);overflow:hidden}
.stp button{height:100%;font-size:20px;font-weight:700;color:var(--act)}
.stp button:hover{background:var(--tint)}
.stp span{text-align:center;font-weight:700;font-size:14px}

.crumb{font-size:13px;color:var(--muted);padding-top:16px;display:flex;gap:6px;flex-wrap:wrap}
.crumb button:hover{text-decoration:underline}
.ph{display:flex;justify-content:space-between;align-items:end;gap:12px;padding-block:6px 14px;flex-wrap:wrap}
.ph h1{font-size:38px;font-weight:800;line-height:1}
.ph .cnt{color:var(--muted);font-size:14px;margin-top:4px}
.browse-l{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;padding-bottom:40px;align-items:start}
.filters{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:4px 16px 12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 140px)}
.fg{border-bottom:1px solid var(--line);padding-block:12px}
.fg:last-child{border:0}
.fg h4{font-size:16px;margin-bottom:8px}
.fg label{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:14px;cursor:pointer}
.fg label span{margin-left:auto;color:var(--muted);font-size:12.5px}
.fg input{accent-color:var(--brand);width:16px;height:16px}
.tbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.tbar select{height:38px;border:1px solid var(--line-2);border-radius:6px;background:var(--card);padding:0 10px}
.fbtn{display:none}
.active-f{display:flex;gap:6px;flex-wrap:wrap}
.af{border:1px solid var(--line-2);background:var(--card);border-radius:6px;padding:4px 8px;font-size:13px;display:flex;gap:6px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:12px}
.none{grid-column:1/-1;background:var(--card);border:1px dashed var(--line-2);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--ink-2)}

.scrim{position:fixed;inset:0;background:rgba(20,16,18,.5);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--card);z-index:80;transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.dh h3{font-size:24px;font-weight:800}
.xb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card)}
.xb:hover{background:var(--tint)}
.dbody{flex:1;overflow-y:auto;padding:14px 18px;display:grid;gap:14px;align-content:start}
.dfoot{border-top:1px solid var(--line);padding:14px 18px;display:grid;gap:10px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%);width:min(860px,calc(100% - 24px));max-height:calc(100% - 40px);overflow:auto;background:var(--card);border-radius:12px;z-index:85;opacity:0;pointer-events:none;transition:.2s}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal > .xb{position:absolute;right:10px;top:10px;z-index:2}
.pd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;padding:28px}
.pd .pimg{background:var(--tint);border-radius:var(--r);aspect-ratio:1;max-width:100%;display:grid;place-items:center;padding:20px;position:relative}
.pd .pimg svg,.pd .pimg img{width:100%;height:100%;object-fit:contain}
.pd .brand{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pd h2{font-size:30px;font-weight:800;line-height:1.05;margin:4px 0 12px}
.pd .meta{display:grid;gap:10px;margin-top:16px;font-size:14px;color:var(--ink-2)}
.pd .meta b{color:var(--ink);display:block}
.fm{padding:24px;display:grid;gap:14px}
.fm h2{font-size:28px;font-weight:800;padding-right:40px}

.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink);border-radius:var(--r);overflow:hidden}
.seg button{padding:10px;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.days{display:flex;gap:8px;overflow-x:auto}
.days button{flex:none;border:1px solid var(--line-2);border-radius:var(--r);padding:8px 14px;text-align:left;font-size:13px;min-width:110px}
.days button b{display:block;font-size:15px}
.days button[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);background:#e9f5f3}
.days button:disabled{opacity:.45;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slot{border:1px solid var(--line-2);border-radius:var(--r);padding:10px 12px;text-align:left;font-size:13px;display:grid;gap:2px}
.slot b{font-size:14.5px}
.slot small{color:var(--muted)}
.slot[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);background:#e9f5f3}
.field{display:grid;gap:5px}
.field label{font-size:13.5px;font-weight:600}
.field input,.field textarea,.field select{border:1px solid var(--line-2);border-radius:6px;padding:10px 12px;width:100%;background:var(--card)}
.field input:focus,.field textarea:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 1px var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
.msg{font-size:13.5px;border-radius:6px;padding:10px 12px}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.bad{background:#fdecee;color:#c2412d}
.msg.info{background:var(--warn-soft);color:var(--ink)}
.msg.cold{background:var(--cold-soft);color:var(--ink)}

.fsum{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--tint);border-radius:var(--r);padding:10px 12px;font-size:13.5px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.zh{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.cl{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.cl .th{width:56px;height:56px;background:var(--tint);border-radius:6px;padding:4px}
.cl .th svg,.cl .th img{width:100%;height:100%;object-fit:contain}
.cl .n{font-size:13.5px;line-height:1.3}
.cl .m{font-size:12px;color:var(--muted)}
.qs{display:grid;grid-template-columns:28px 26px 28px;align-items:center;border:1px solid var(--line-2);border-radius:6px;height:30px}
.qs button{height:100%;font-weight:700}
.qs span{text-align:center;font-weight:700;font-size:13px}
.tots{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:14px}
.tots .g{font-family:var(--f-head);font-size:24px;font-weight:800}

.co{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start;padding-block:10px 50px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px;min-width:0}
.box h2{font-size:24px;font-weight:800;display:flex;gap:10px;align-items:center}
.box h2 .n{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-size:15px;display:grid;place-items:center;flex:none}
.costack{display:grid;gap:14px;min-width:0}
.sum{position:sticky;top:calc(env(safe-area-inset-top,0px) + 140px)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;border:1px solid var(--line-2);border-radius:var(--r);padding:12px 14px;cursor:pointer;font-size:14.5px;flex-wrap:wrap}
.opt:has(input:checked){border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);background:#e9f5f3}
.opt input{accent-color:var(--brand);width:18px;height:18px;flex:none}
.opt > span:first-of-type{flex:1;min-width:180px}

const SQ={card:null,busy:false};
async function mountSquare(){
  const cfg=window.LEPP_SQUARE, el=$("#sq-card"), msg=$("#sqMsg"); if(!cfg||!el||SQ.busy) return;
  SQ.busy=true;
  try{
    if(!window.Square) await new Promise((ok,no)=>{ const sc=document.createElement("script"); sc.src=cfg.env==="production"?"https://web.squarecdn.com/v1/square.js":"https://sandbox.web.squarecdn.com/v1/square.js"; sc.onload=ok; sc.onerror=no; document.head.appendChild(sc); });
    if(SQ.card){ try{ await SQ.card.destroy(); }catch(e){} SQ.card=null; }
    const payments=window.Square.payments(cfg.appId,cfg.locationId);
    SQ.card=await payments.card(); await SQ.card.attach("#sq-card"); if(msg) msg.textContent="";
  }catch(e){ if(msg) msg.textContent="The card form didn't load. Choose another payment option, or refresh to try again."; }
  SQ.busy=false;
}
function syncPay(){ const w=$("#sqWrap"); if(!w) return; const v=(document.querySelector('[name="pay"]:checked')||{}).value; w.hidden=v!=="online"; if(v==="online"&&!SQ.card) mountSquare(); }

/* ============ PLACE ORDER ============ */
async function placeOrder(){
  const err=$("#coErr"), del=S.ful.mode==="delivery", bad=m=>{err.innerHTML=`<div class="msg bad">${m}</div>`;};
  const name=$("#fName").value.trim(), phone=$("#fPhone").value.trim(), email=$("#fEmail").value.trim();
  if(!S.ful.slot) return bad("Choose a delivery or pick-up time.");
  if(!name) return bad("Add your name so we know whose order it is.");
  if(!/^[\d\s+()-]{8,}$/.test(phone)) return bad("Add a mobile number so we can text you updates.");
  let addr="",sub="",pc="";
  if(del){ addr=$("#fAddr").value.trim(); sub=$("#fSub").value.trim(); pc=$("#fPc").value.trim(); if(!addr||!sub) return bad("Add your street address and suburb."); const c=checkPostcode(pc); if(!c.ok) return bad(c.msg); S.ful.pc=pc; saveFul(); }
  const t=totals(); if(!t.count) return bad("Your cart is empty.");
  if(del&&t.sub<CFG.minDelivery) return bad(`Delivery orders start at ${money(CFG.minDelivery)}. Add a little more or switch to Click & Collect.`);
  const f=$("#coForm");
  const o={no:"LP"+Date.now().toString().slice(-7),createdAt:Date.now(),mode:S.ful.mode,slot:S.ful.slot.v,when:slotText(),name,phone,email,address:addr,suburb:sub,postcode:pc,
    subs:f.querySelector('[name="subs"]:checked').value,pay:f.querySelector('[name="pay"]:checked').value,notes:$("#fNote").value.trim(),
    items:t.lines.map(l=>({key:l.key,name:l.p.name,size:l.w||l.p.size||"",qty:l.qty,unit:r2(l.unit)})),
    subtotal:r2(t.sub),discount:r2(t.disc),fee:r2(t.fee),total:r2(t.total),promo:S.promo?S.promo.code:"",status:"new"};
  const b=$("#placeBtn"); b.disabled=true; b.textContent=o.pay==="online"?"Taking payment…":"Placing your order…";
  if(window.LEPP_API){
    try{
      let sourceId=null;
      if(o.pay==="online"){ if(!SQ.card) throw {message:"The card form hasn't loaded. Refresh the page or choose another payment option."}; const tk=await SQ.card.tokenize(); if(tk.status!=="OK") throw {message:"Check your card details and try again."}; sourceId=tk.token; }
      const res=await window.LEPP_API.placeOrder(o,sourceId);
      Object.assign(o,res.order||{});
    }catch(er){ b.disabled=false; b.textContent="Place order"; return bad(esc(er&&er.message||"We couldn't place your order. Try again.")); }
  } else if(db){ try{ await db.collection("orders").doc(o.no).set(o); }catch(e){} }
  ls.set("rv2_details",{name,phone,email,addr,sub,pc});
  const r=ls.get("rv2_orders",[]); r.unshift(o); ls.set("rv2_orders",r.slice(0,12));
  if(S.promo&&S.promo.firstOnly) ls.set("rv2_promo_used",true);
  S.last=o; S.cart={}; S.promo=null; saveCart(); go("confirmed");
}

  if(A.sec) L=L.filter(p=>p.sec===A.sec);
  const st=A.status;
  if(st==="visible") L=L.filter(shown); else if(st==="hidden") L=L.filter(p=>!shown(p));
  else if(st==="out") L=L.filter(p=>p.out); else if(st==="special") L=L.filter(p=>p.was||p.special);
  else if(st==="custom") L=L.filter(p=>p.src==="custom"); else if(st==="edited") L=L.filter(p=>p.edited);
  else if(st==="nophoto") L=L.filter(p=>!hasPhoto(p)); else if(st==="featured") L=L.filter(p=>p.featured);
  const S2={name:(a,b)=>a.name.localeCompare(b.name), plow:(a,b)=>a.price-b.price, phigh:(a,b)=>b.price-a.price, sec:(a,b)=>a.sec.localeCompare(b.sec)||a.sub.localeCompare(b.sub)||a.name.localeCompare(b.name), upd:(a,b)=>((OV[b.id]||{}).updatedAt||0)-((OV[a.id]||{}).updatedAt||0)};

}

async function bulkApply(){
  const act=($("#bkAct")||{}).value; if(!act) return toast("Choose an action first.");
  const P1=$("#bkP")?$("#bkP").value.trim():"", P2=$("#bkP2")?$("#bkP2").value:"";
  const ids=[...A.sel].filter(id=>CMAP[id]);
  let fn;
  if(act==="show") fn=id=>{ const p=CMAP[id]; const patch={hidden:false}; return writeOv(id,patch).then(()=>!secVisible(p.sec)&&(A.warnSec=p.sec)); };
  else if(act==="hide") fn=id=>writeOv(id,{hidden:true});
  else if(act==="instock") fn=id=>writeOv(id,{stock:true,qty:(CMAP[id].qty!=null&&+CMAP[id].qty<=0)?null:CMAP[id].qty});
  else if(act==="outstock") fn=id=>writeOv(id,{stock:false});
  else if(act==="feature") fn=id=>writeOv(id,{featured:true});
  else if(act==="unfeature") fn=id=>writeOv(id,{featured:false});
  else if(act==="endspecial") fn=id=>writeOv(id,{special:null,saleEnds:""});
  else if(act==="special"){ const pct=num(P1); if(!(pct>0&&pct<90)) return toast("Enter a % off between 1 and 89."); fn=id=>{ const p=CMAP[id]; return writeOv(id,{special:r2(p.regular*(1-pct/100)),saleEnds:P2||""}); }; }
  else if(act==="price"){ const pct=num(P1); if(pct==null||pct<=-90) return toast("Enter a % change, e.g. 5 or -10."); fn=id=>{ const p=CMAP[id]; const reg=r2(p.regular*(1+pct/100)); const patch={regular:reg}; if(p.special!=null&&p.special!=="") patch.special=r2(p.special*(1+pct/100)); return writeOv(id,patch); }; }
  else if(act==="section"){ if(!secById(P1)) return toast("Choose a section."); fn=id=>writeOv(id,{sec:P1}); }
  else if(act==="category"){ if(!P1) return toast("Type a category name."); fn=id=>writeOv(id,{sub:P1}); }
  else if(act==="reset"){ fn=id=>{ if(CMAP[id].src==="custom"||!OV[id]) return; delete OV[id]; return db.collection("products").doc(id).delete(); }; }
  else if(act==="delete"){ const own=ids.filter(id=>CMAP[id].src==="custom"); if(!own.length) return toast("Only products you added can be deleted. Hide the others instead."); if(A.confirm!=="bulkdel"){ A.confirm="bulkdel"; return toast(`Click Apply again to delete ${own.length} product${own.length>1?"s":""} for good.`); } A.confirm=null; ids.length=0; ids.push(...own); fn=id=>{ const ph=(OV[id]||{}).photos||[]; delete OV[id]; return db.collection("products").doc(id).delete().then(()=>Promise.all(ph.map(x=>x.id&&assets?assets.delete(x.id).catch(()=>{}):0))); }; }
  if(!fn) return;
  A.warnSec=null; toast(`Updating ${ids.length} products…`);
  await pool(ids,fn,4,(d,t)=>{ if(d%25===0||d===t) toast(`Updated ${d} of ${t}`); });
  rebuild(); A.sel.clear(); renderView(); toast(`Done. ${ids.length} product${ids.length>1?"s":""} updated.`+(A.warnSec?` Note: the ${secName(A.warnSec)} section is hidden. Turn it on in Sections & homepage.`:""));
}

function collectEdit(){
  const f=$("#edForm"); if(!f) return A.edit; const e=clone(A.edit);

  e.tags=[...f.querySelectorAll("[data-eftag]")].filter(x=>x.checked).map(x=>x.dataset.eftag);
  if(e.special===0) e.special=null;
  return e;
}

async function uploadPhotos(files){
  if(!assets) return toast("Photo uploads need the owner or an editor to be signed in.");
  A.edit=collectEdit(); const list=[...files].filter(f=>/^image\//.test(f.type)); if(!list.length) return toast("Choose image files (JPG or PNG).");
  const msg=$("#upMsg"); let n=0;
  for(const f of list){
    if(f.size>20*1024*1024){ toast(`${f.name} is over 20 MB. Choose a smaller photo.`); continue; }
    if(msg) msg.textContent=`Uploading ${++n} of ${list.length}…`;
    try{ const a=await assets.upload(f); A.edit.photos.push({url:a.url,id:a.id}); $("#edPhotos").innerHTML=photosHTML(); bindDrop(); updatePreview(); }
    catch(er){ toast(er&&er.code==="quota_or_state"?"Photo storage is full. Remove unused photos first.":er&&er.code==="unsupported_type"?`${f.name} isn't a supported image type.`:"Upload failed. Try again."); }
  }
  const m2=$("#upMsg"); if(m2) m2.textContent=n?`${n} photo${n>1?"s":""} added. Remember to save.`:"";
}
function bindDrop(){ const d=$("#drop"); if(!d) return; d.addEventListener("dragover",ev=>{ev.preventDefault();d.classList.add("over");}); d.addEventListener("dragleave",()=>d.classList.remove("over")); d.addEventListener("drop",ev=>{ev.preventDefault();d.classList.remove("over");uploadPhotos(ev.dataTransfer.files);}); }

async function saveEdit(){
  const e=collectEdit();
  if(!e.name) return toast("Give the product a name.");
  if(!(e.regular>0)) return toast("Enter a regular price above $0.");
  if(e.special!=null&&!(e.special<e.regular)) return toast("The special price must be lower than the regular price.");
  if(!e.sub) e.sub="Other";
  let doc;
  if(A.editBase){ doc={}; EDIT_KEYS.forEach(k=>{ const b=k in A.editBase?A.editBase[k]:BASE_DEF[k]; if(JSON.stringify(e[k]??null)!==JSON.stringify(b??null)) doc[k]=e[k]; }); }
  else { doc=Object.assign({},A.copyArt||{},e,{custom:true}); }
  const btns=document.querySelectorAll("[data-asave]"); btns.forEach(b=>{b.disabled=true;b.textContent="Saving…";});
  try{
    if(A.editBase&&!Object.keys(doc).length){ if(OV[A.editId]) await db.collection("products").doc(A.editId).delete(); delete OV[A.editId]; }
    else { doc.updatedAt=Date.now(); await db.collection("products").doc(A.editId).set(doc); OV[A.editId]=doc; }
    const used=new Set(); Object.values(OV).forEach(o=>(o.photos||[]).forEach(x=>used.add(x.id)));
    for(const id of A.removed) if(id&&!used.has(id)&&assets) assets.delete(id).catch(()=>{});
    A.removed=[]; A.isNew=false; A.edit=e; rebuild(); toast("Saved. The shop is updated."); renderView();
  }catch(er){ toast("Couldn't save. Check you're signed in as the owner or an editor."); btns.forEach(b=>{b.disabled=false;b.textContent="Save product";}); }
}

function progHTML(b){ return `<div style="display:grid;gap:6px;margin-top:8px"><div class="prog"><i style="width:${b.total?Math.round(b.done/b.total*100):0}%"></i></div><div class="hint num">${esc(b.stage)} · ${b.done} of ${b.total}</div></div>`; }
function setBusy(b){ A.busy=b; const el=$("#impProg"); if(el) el.innerHTML=b?progHTML(b):""; }
function dataURLtoBlob(u){ const [h,d]=u.split(","); const mime=(h.match(/data:([^;]+)/)||[])[1]||"image/jpeg"; const bin=atob(d); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return new Blob([a],{type:mime}); }
async function upRetry(blob,opt){ for(let t=0;t<4;t++){ try{ return await assets.upload(blob,opt); }catch(e){ if(e&&["too_large","unsupported_type","quota_or_state","not_uploader"].includes(e.code)) throw e; await new Promise(r=>setTimeout(r,1500*(t+1))); } } throw {code:"failed",message:"Upload failed"}; }
async function runImport(file){
  if(!assets||!db) return toast("Importing needs the owner to be signed in.");
  let data; setBusy({stage:"Reading the file",done:0,total:1});
  try{ data=JSON.parse(await file.text()); }catch(e){ setBusy(null); return toast("That file isn't a catalogue file. Choose the .json catalogue file."); }
  if(!data||!Array.isArray(data.products)||!Array.isArray(data.atlases)){ setBusy(null); return toast("That file doesn't contain a product catalogue."); }
  const cols=data.cols||10, maxIdx={}; data.products.forEach(p=>{ if(p.img) maxIdx[p.img[0]]=Math.max(maxIdx[p.img[0]]||0,p.img[1]); });
  const total=data.atlases.length+1, atl=[]; let done=0;
  try{
    for(let i=0;i<data.atlases.length;i++){
      setBusy({stage:"Uploading photo sheets",done,total});
      const r=await upRetry(dataURLtoBlob(data.atlases[i]));
      atl.push({url:r.url,id:r.id,rows:Math.floor((maxIdx[i]||0)/cols)+1}); done++;
    }
    setBusy({stage:"Saving the product list",done,total});
    const prods=data.products.map(p=>{ const o={id:p.id,name:p.name,sec:p.sec,sub:p.sub,price:p.price,was:p.was,img:p.img||null}; if(p.sku) o.sku=p.sku; if(p.short) o.short=p.short; if(p.desc) o.desc=p.desc; if(p.stock===false) o.stock=false; return o; });
    const json=JSON.stringify({v:1,cols,atlases:atl.map(a=>({url:a.url,rows:a.rows})),products:prods});
    const r=await upRetry(new Blob([json],{type:"application/json"}),{type:"application/json"});
    const old=IMPORT_META;
    await db.doc("settings/catalog").set({url:r.url,id:r.id,atlasIds:atl.map(a=>a.id),count:prods.length,source:data.source||file.name,importedAt:new Date().toISOString()});
    if(old){ [old.id,...(old.atlasIds||[])].forEach(id=>id&&assets.delete(id).catch(()=>{})); }
    setBusy(null); toast(`Imported ${prods.length.toLocaleString()} products.`); renderView();
  }catch(e){ setBusy(null); atl.forEach(a=>assets.delete(a.id).catch(()=>{})); toast(e&&e.code==="quota_or_state"?"Photo storage is full, so the import stopped. Nothing was changed.":"The import stopped part-way. Nothing was changed. Try again."); renderView(); }
}
async function removeImport(){
  const m=IMPORT_META; if(!m) return;
  try{ await db.doc("settings/catalog").delete(); [m.id,...(m.atlasIds||[])].forEach(id=>id&&assets&&assets.delete(id).catch(()=>{})); IMPORTED=[]; ATL=[]; loadedUrl=null; IMPORT_META=null; rebuild(); toast("Imported catalogue removed."); renderView(); }

}
const CSV_COLS=["code","name","brand","size","sku","section","category","regular_price","special_price","special_ends","in_stock","quantity","visible","featured","tags","badge","short_description"];
const csvCell=v=>{ const s=String(v??""); return /[",\n\r]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; };
function toCSV(){ const yn=b=>b?"yes":"no"; const rows=[CSV_COLS.join(",")]; CATALOG.forEach(p=>rows.push([p.id,p.name,p.brand,p.size,p.sku,p.sec,p.sub,p.regular,p.special??"",p.saleEnds,yn(p.stock!==false),p.qty??"",yn(!p.hidden),yn(p.featured),p.tags.join(" "),p.badge,p.short].map(csvCell).join(","))); return rows.join("\r\n"); }
function parseCSV(t){ const rows=[]; let row=[],cell="",q=false; for(let i=0;i<t.length;i++){ const c=t[i]; if(q){ if(c==='"'){ if(t[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; } else if(c==='"') q=true; else if(c===","){ row.push(cell); cell=""; } else if(c==="\n"||c==="\r"){ if(c==="\r"&&t[i+1]==="\n") i++; row.push(cell); rows.push(row); row=[]; cell=""; } else cell+=c; } if(cell!==""||row.length){ row.push(cell); rows.push(row); } return rows.filter(r=>r.some(x=>x.trim()!=="")); }
async function importCSV(file){
  let rows; try{ rows=parseCSV((await file.text()).replace(/^﻿/,"")); }catch(e){ return toast("Couldn't read that file."); }
  if(rows.length<2) return toast("The CSV has no product rows.");
  const H=rows[0].map(h=>h.trim().toLowerCase()), ix=k=>H.indexOf(k);
  if(ix("name")<0&&ix("code")<0) return toast("The CSV needs a code or name column. Download the products CSV to see the layout.");
  const yn=v=>/^(y|yes|true|1)$/i.test(v.trim());
  const secOf=v=>{ v=v.trim().toLowerCase(); const s=CFG.sections.find(s=>s.id===v||s.name.toLowerCase()===v); return s?s.id:null; };
  const jobs=[]; let bad=0;
  rows.slice(1).forEach(r=>{
    const g=k=>{ const i=ix(k); return i<0?"":(r[i]||"").trim(); };
    const code=g("code"), p=code?CMAP[code]:null; const patch={};
    if(g("name")) patch.name=g("name"); if(g("brand")) patch.brand=g("brand"); if(g("size")) patch.size=g("size"); if(g("sku")) patch.sku=g("sku");
    if(g("section")){ const s=secOf(g("section")); if(s) patch.sec=s; }
    if(g("category")) patch.sub=g("category");
    if(g("regular_price")){ const n=num(g("regular_price").replace(/[$,]/g,"")); if(n>0) patch.regular=n; }
    if(g("special_price")){ if(/^none$/i.test(g("special_price"))){ patch.special=null; patch.saleEnds=""; } else { const n=num(g("special_price").replace(/[$,]/g,"")); if(n>0) patch.special=n; } }
    if(g("special_ends")&&/^\d{4}-\d{2}-\d{2}$/.test(g("special_ends"))) patch.saleEnds=g("special_ends");
    if(g("in_stock")) patch.stock=yn(g("in_stock")); if(g("quantity")!=="") { const n=num(g("quantity")); if(n!=null) patch.qty=n; }
    if(g("visible")) patch.hidden=!yn(g("visible")); if(g("featured")) patch.featured=yn(g("featured"));
    if(g("tags")) patch.tags=g("tags").toLowerCase().split(/[\s,;]+/).filter(t=>[NE,HAL,VEG].includes(t));
    if(g("badge")) patch.badge=g("badge"); if(g("short_description")) patch.short=g("short_description");
    if(p){ const diff={}; Object.keys(patch).forEach(k=>{ if(JSON.stringify(patch[k]??null)!==JSON.stringify(p[k]??null)) diff[k]=patch[k]; }); if(Object.keys(diff).length) jobs.push([code,diff]); }
    else if(!code&&patch.name&&patch.regular>0){ const id="c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); jobs.push([id,Object.assign({sec:"dry",sub:"Other",tags:[],photos:[]},patch,{custom:true})]); }
    else bad++;
  });
  if(!jobs.length) return toast(bad?`No changes found. ${bad} row${bad>1?"s were":" was"} skipped.`:"No changes found.");
  setBusy({stage:"Updating products",done:0,total:jobs.length});
  await pool(jobs,([id,patch])=>writeOv(id,patch),4,(d,t)=>setBusy({stage:"Updating products",done:d,total:t}));
  setBusy(null); rebuild(); toast(`Updated ${jobs.length} product${jobs.length>1?"s":""}.${bad?` ${bad} row${bad>1?"s":""} skipped (no code match, or a new row without name and price).`:""}`); renderView();
}

  if(d.more!==undefined){ S.limit+=48; const y=window.scrollY; renderView(); window.scrollTo(0,y); return; }
  if(d.scroll){ const el=document.getElementById(d.scroll); el.scrollBy({left:+d.dir*el.clientWidth*.8,behavior:"smooth"}); return; }
  if(d.slide!==undefined){ setSlide(+d.slide); startCarousel(); return; }
  if(d.collect!==undefined){ S.ful.mode="collect"; S.ful.slot=null; saveFul(); ensureSlot(); renderNav(); updateCartBits(); toast("Click & Collect selected: ready in 5 minutes"); return; }
  if(d.ful!==undefined){ closeAll(); openFul(); return; }
  if(d.fmode){ S.ful.mode=d.fmode; S.ful.slot=null; saveFul(); ensureSlot(); pickDay=null; const ab=$("#addrBlock"); if(ab) ab.hidden=d.fmode!=="delivery"; rerenderPicker(); return; }
  if(d.day!==undefined){ pickDay=+d.day; rerenderPicker(); return; }
  if(d.slot){ S.ful.slot={v:d.slot,date:d.sdate,day:d.sday,l:d.sl}; saveFul(); pickDay=null; rerenderPicker(); return; }
  if(d.pccheck!==undefined){ const pc=$("#pcIn").value.trim(), r=checkPostcode(pc); $("#pcMsg").innerHTML=`<div class="msg ${r.ok?"ok":"bad"}" style="margin-top:6px">${r.msg}</div>`; if(r.ok){ S.ful.pc=pc; saveFul(); renderNav(); const fp=$("#fPc"); if(fp) fp.value=pc; } return; }
  if(d.fsave!==undefined){ const pcEl=$("#pcIn"); if(pcEl&&pcEl.value.trim()){ const r=checkPostcode(pcEl.value.trim()); if(!r.ok){ $("#pcMsg").innerHTML=`<div class="msg bad" style="margin-top:6px">${r.msg}</div>`; return; } S.ful.pc=pcEl.value.trim(); saveFul(); } closeAll(); renderNav(); updateCartBits(); toast(S.ful.mode==="delivery"?"Delivery time saved":"Pick-up time saved"); return; }
  if(d.fopen!==undefined){ $("#filters").classList.add("open"); $("#scrim").classList.add("on"); return; }
  if(d.fclose!==undefined){ closeAll(); return; }
  if(d.fclear!==undefined){ S.fsub.clear(); S.ftag.clear(); S.fprice=""; renderView(); return; }
  if(d.unf){ const i=d.unf.indexOf(":"), k=d.unf.slice(0,i), v=d.unf.slice(i+1); if(k==="sub") S.fsub.delete(v); if(k==="tag") S.ftag.delete(v); if(k==="price") S.fprice=""; renderView(); return; }
  if(d.promo!==undefined){ const code=$("#promoIn").value.trim().toUpperCase(), m=$("#promoMsg"); const pr=(CFG.promos||[]).find(p=>p.active&&String(p.code).toUpperCase()===code);
    if(pr&&!(pr.firstOnly&&ls.get("rv2_promo_used",false))){ S.promo={code:pr.code,pct:+pr.pct,firstOnly:!!pr.firstOnly}; $("#sumTots").innerHTML=totsHTML(totals()); m.innerHTML=`<div class="msg ok">${+pr.pct}% off applied.</div>`; b.textContent="Applied"; updateCartBits(); }
    else m.innerHTML=`<div class="msg bad">${!code?"Enter a promo code.":pr?"This code is for your first order only.":"That code isn't valid. Check the spelling and try again."}</div>`; return; }
  if(d.reorder!==undefined){ const o=ls.get("rv2_orders",[])[+d.reorder]; if(o){ o.items.forEach(i=>{ const p=prod(i.key.split("|")[0]); if(p&&shown(p)&&!p.out) S.cart[i.key]=(S.cart[i.key]||0)+i.qty; }); saveCart(); updateCartBits(); openCart(); } return; }
  /* admin */
  if(d.atab){ if(A.edit&&d.atab==="products"){ A.edit=null; } A.tab=d.atab; A.cfg=null; A.confirm=null; if(d.atab!=="products") A.edit=null; renderView(); window.scrollTo(0,0); return; }
  if(d.aedit){ startEdit(d.aedit); return; }
  if(d.anew!==undefined){ newProduct(); return; }
  if(d.adup!==undefined){ newProduct(A.editId); toast("Copy created. Change it, then save."); return; }
  if(d.aback!==undefined||d.acancel!==undefined){ A.edit=null; A.removed=[]; renderView(); return; }
  if(d.asave!==undefined){ saveEdit(); return; }
  if(d.areset!==undefined){ if(A.confirm!=="reset"){ A.confirm="reset"; A.edit=collectEdit(); renderView(); return; } A.confirm=null; try{ await db.collection("products").doc(A.editId).delete(); delete OV[A.editId]; rebuild(); toast("Changes undone."); startEdit(A.editId); }catch(er){ toast("Couldn't undo. Try again."); } return; }
  if(d.adel!==undefined){ if(A.confirm!=="del"){ A.confirm="del"; A.edit=collectEdit(); renderView(); return; } A.confirm=null; try{ const ph=(OV[A.editId]||{}).photos||[]; await db.collection("products").doc(A.editId).delete(); delete OV[A.editId]; ph.forEach(x=>x.id&&assets&&assets.delete(x.id).catch(()=>{})); rebuild(); A.edit=null; toast("Product deleted."); renderView(); }catch(er){ toast("Couldn't delete. Try again."); } return; }
  if(d.phmain!==undefined){ A.edit=collectEdit(); const ph=A.edit.photos, [x]=ph.splice(+d.phmain,1); ph.unshift(x); $("#edPhotos").innerHTML=photosHTML(); bindDrop(); updatePreview(); return; }
  if(d.phmove!==undefined){ A.edit=collectEdit(); const ph=A.edit.photos, i=+d.phmove, j=i+(+d.dir); [ph[i],ph[j]]=[ph[j],ph[i]]; $("#edPhotos").innerHTML=photosHTML(); bindDrop(); updatePreview(); return; }
  if(d.phdel!==undefined){ A.edit=collectEdit(); const [x]=A.edit.photos.splice(+d.phdel,1); if(x&&x.id) A.removed.push(x.id); $("#edPhotos").innerHTML=photosHTML(); bindDrop(); updatePreview(); toast("Photo removed. Save to keep this change."); return; }
  if(d.aselmatch!==undefined){ adminFiltered().forEach(p=>A.sel.add(p.id)); renderView(); return; }
  if(d.apage){ A.page+=+d.apage; renderView(); window.scrollTo(0,0); return; }
  if(d.bkgo!==undefined){ bulkApply(); return; }
  if(d.bkclear!==undefined){ A.sel.clear(); renderView(); return; }
  if(d.adv){ const o=orders.find(x=>x.no===d.adv); if(o&&db){ b.disabled=true; db.collection("orders").doc(o.no).update({status:NEXT[o.status]}).catch(()=>{ toast("Couldn't update that order. Try again."); b.disabled=false; }); } return; }
  if(d.cfgsave!==undefined){ saveCfg(); return; }
  if(d.secmove!==undefined){ const c=readCfgInputs(), i=+d.secmove, j=i+(+d.dir); [c.sections[i],c.sections[j]]=[c.sections[j],c.sections[i]]; renderView(); return; }
  if(d.heromove!==undefined){ const c=readCfgInputs(), i=+d.heromove, j=i+(+d.dir); [c.hero[i],c.hero[j]]=[c.hero[j],c.hero[i]]; renderView(); return; }
  if(d.herodel!==undefined){ const c=readCfgInputs(); c.hero.splice(+d.herodel,1); renderView(); return; }
  if(d.heroadd!==undefined){ const c=readCfgInputs(); c.hero.push({title:"New banner",text:"",cta:"Shop now",link:"specials",bg:"#0f766e",fg:"light",badge:"",products:""}); renderView(); return; }
  if(d.promodel!==undefined){ const c=readCfgInputs(); c.promos.splice(+d.promodel,1); renderView(); return; }
  if(d.promoadd!==undefined){ const c=readCfgInputs(); c.promos.push({code:"",pct:10,firstOnly:false,active:true}); renderView(); return; }
  if(d.catren!==undefined){ const inp=document.querySelector(`[data-catname="${CSS.escape(d.catren)}"]`), nn=inp?inp.value.trim():""; if(!nn) return toast("Type the new category name."); const ids=CATALOG.filter(p=>p.sec===d.csec&&p.sub===d.catren).map(p=>p.id); readCfgInputs(); toast(`Renaming ${ids.length} products…`); await pool(ids,id=>writeOv(id,{sub:nn}),4); rebuild(); toast(`Renamed to ${nn}.`); renderView(); return; }
  if(d.catmove!==undefined){ const sel=document.querySelector(`[data-catsec="${CSS.escape(d.catmove)}"]`), to=sel?sel.value:""; if(!to||to===d.csec) return toast("Choose a different section."); const ids=CATALOG.filter(p=>p.sec===d.csec&&p.sub===d.catmove).map(p=>p.id); readCfgInputs(); toast(`Moving ${ids.length} products…`); await pool(ids,id=>writeOv(id,{sec:to}),4); rebuild(); toast(`Moved to ${secName(to)}.`); renderView(); return; }
  if(d.impjson!==undefined){ pickFile("json",".json,application/json"); return; }
  if(d.csvin!==undefined){ pickFile("csv",".csv,text/csv"); return; }
  if(d.csvout!==undefined){ if(!downloads) return; try{ await downloads.save({filename:"leppington-products.csv",data:"﻿"+toCSV()}); }catch(er){ if(er&&er.code!=="declined") toast("Couldn't download the file."); } return; }
  if(d.impremove!==undefined){ if(A.confirm!=="impremove"){ A.confirm="impremove"; renderView(); return; } A.confirm=null; removeImport(); return; }
});
document.addEventListener("change",async e=>{
  const t=e.target, d=t.dataset;
  if(t.name==="pay"){ syncPay(); return; }
  if(t.id==="filePick"){ const f=t.files&&t.files[0]; if(!f) return; if(filePurpose==="json") runImport(f); else if(filePurpose==="csv") importCSV(f); return; }
  if(t.id==="edFiles"){ uploadPhotos(t.files); return; }
  if(d.w){ ls.set("rv3_w_"+d.w,t.value); refreshCards(d.w); if(modalIsProduct()) openProduct(d.w,true); return; }
  if(t.id==="sort"){ S.sort=t.value; S.limit=48; renderView(); return; }
  if(d.fsub!==undefined){ t.checked?S.fsub.add(d.fsub):S.fsub.delete(d.fsub); keepFilters(); return; }
  if(d.ftag!==undefined){ t.checked?S.ftag.add(d.ftag):S.ftag.delete(d.ftag); keepFilters(); return; }
  if(d.fprice!==undefined){ S.fprice=d.fprice; keepFilters(); return; }
  if(d.asel!==undefined){ t.checked?A.sel.add(d.asel):A.sel.delete(d.asel); renderView(); return; }
  if(d.aselall!==undefined){ const L=adminFiltered().slice(A.page*A.per,(A.page+1)*A.per); L.forEach(p=>t.checked?A.sel.add(p.id):A.sel.delete(p.id)); renderView(); return; }
  if(t.id==="asec"){ A.sec=t.value; A.page=0; renderView(); return; }
  if(t.id==="ast"){ A.status=t.value; A.page=0; renderView(); return; }
  if(t.id==="asort"){ A.sort=t.value; A.page=0; renderView(); return; }
  if(t.id==="bkAct"){ $("#bkParam").innerHTML=bulkParamHTML(t.value); A.confirm=null; return; }
  if(t.closest&&t.closest("#edForm")){ if(d.ef==="sec"){ A.edit=collectEdit(); const dl=$("#subList"); if(dl) dl.innerHTML=[...new Set(CATALOG.filter(p=>p.sec===A.edit.sec).map(p=>p.sub))].sort().map(s=>`<option value="${esc(s)}">`).join(""); } updatePreview(); return; }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.closest&&t.closest("#edForm")){ if(t.id==="edPct"){ const pct=num(t.value), reg=num(($("[data-ef='regular']")||{}).value); const sp=$("[data-ef='special']"); if(sp&&pct>0&&pct<90&&reg>0) sp.value=r2(reg*(1-pct/100)); } updatePreview(); return; }
  if(t.id==="aq"){ clearTimeout(t._t); t._t=setTimeout(()=>{ A.q=t.value; A.page=0; const pos=t.selectionStart; renderView(); const n=$("#aq"); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(er){} } },250); }
});
function keepFilters(){ const open=$("#filters")&&$("#filters").classList.contains("open"); S.limit=48; renderView(); if(open){ $("#filters").classList.add("open"); $("#scrim").classList.add("on"); } }
document.addEventListener("submit",async e=>{ e.preventDefault();
  if(e.target.id==="loginForm"){ const er=$("#lgErr"); try{ await window.LEPP_RT.auth.signIn($("#lgEmail").value.trim(),$("#lgPw").value); location.reload(); }catch(x){ er.innerHTML=`<div class="msg bad">${esc(x&&x.message||"Sign-in failed. Check your email and password.")}</div>`; } return; } if(e.target.id==="srch"){ S.q=$("#q").value; $("#q").blur(); go("search"); } if(e.target.id==="coForm") placeOrder(); });
let qT; $("#q").addEventListener("input",e=>{ clearTimeout(qT); qT=setTimeout(()=>{ S.q=e.target.value; S.limit=48; if(S.q.trim().length>1) go("search"); else if(route()==="search") renderView(); },220); });
$("#cartBtn").onclick=openCart; $("#mcartBtn").onclick=openCart; $("#fulBtn").onclick=openFul; $("#scrim").onclick=closeAll;
$("#browseBtn").onclick=()=>{ const m=$("#mega"); m.hidden=!m.hidden; $("#browseBtn").setAttribute("aria-expanded",String(!m.hidden)); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeAll(); $("#mega").hidden=true; $("#browseBtn").setAttribute("aria-expanded","false"); } });

/* ============ BOOT ============ */
$("#yr").textContent=new Date().getFullYear();
rebuild(); renderView(); initCloud();
</script>
